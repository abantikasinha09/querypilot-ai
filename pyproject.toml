[project]
name = "querypilot-ai"
version = "0.1.0"
description = "An AI-powered Text-to-SQL agent using LangChain and Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-community>=0.3.0",
    "langgraph>=1.0.6",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "langchain-groq>=1.1.3",
    "streamlit>=1.64.0",
]

[project.urls]
Repository = "https://github.com/abantikasinha09/querypilot-ai.git"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
